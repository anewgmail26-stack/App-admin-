<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Tunnel Admin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="toast" class="toast"></div>

  <main id="loginView" class="login-wrap">
    <form id="loginForm" class="card login-card">
      <h1>Admin Login</h1>
      <label>Email<input id="loginEmail" type="email" required></label>
      <label>Password<input id="loginPassword" type="password" required></label>
      <button id="loginBtn" class="btn primary" type="submit">Login</button>
    </form>
  </main>

  <div id="appView" class="hidden">
    <aside class="sidebar">
      <h2>NOVA Admin</h2>
      <p id="userEmail" class="muted">-</p>
      <button class="tab active" data-screen="dashboard">Dashboard</button>
      <button class="tab" data-screen="servers">Servers</button>
      <button class="tab" data-screen="profiles">Profiles</button>
      <button class="tab" data-screen="settings">Settings</button>
      <button id="logoutBtn" class="btn ghost">Logout</button>
    </aside>

    <main class="content">
      <header class="top">
        <h3 id="title">Dashboard</h3>
        <button id="refreshBtn" class="btn secondary">Refresh</button>
      </header>

      <section id="dashboard" class="screen show">
        <div class="grid3">
          <article class="card"><small>Config Version</small><strong id="dashVersion">0</strong></article>
          <article class="card"><small>Total Servers</small><strong id="dashServers">0</strong></article>
          <article class="card"><small>Total Profiles</small><strong id="dashProfiles">0</strong></article>
        </div>
        <article class="card">
          <small>Notice</small>
          <p id="dashNotice">-</p>
        </article>
      </section>

      <section id="servers" class="screen">
        <div class="split">
          <form id="serverForm" class="card form">
            <h4 id="serverFormTitle">Add Server</h4>
            <input id="serverDocId" type="hidden">
            <label>Document ID (optional)<input id="serverCustomId"></label>
            <label>Server Name*<input id="serverName" required></label>
            <label>Country<input id="serverCountry"></label>
            <label>Flag<input id="serverFlag" placeholder="sg"></label>
            <label>Protocol*
              <select id="serverProtocol" required>
                <option>V2Ray VMess</option>
                <option>V2Ray VLESS</option>
                <option>SSH</option>
                <option>OVPN</option>
                <option>OpenVPN</option>
                <option>Trojan</option>
                <option>Shadowsocks</option>
              </select>
            </label>
            <label>Host<input id="serverHost"></label>
            <label>Port<input id="serverPort" type="number" min="1" max="65535"></label>
            <label>Username<input id="serverUsername"></label>
            <label>Password<input id="serverPassword"></label>
            <label>SNI<input id="serverSni"></label>
            <label>Status*
              <select id="serverStatus"><option>active</option><option>inactive</option></select>
            </label>
            <label>Premium
              <select id="serverPremium"><option value="false">Free</option><option value="true">Premium</option></select>
            </label>
            <label>Sort Order*<input id="serverSortOrder" type="number" value="0" required></label>
            <label>Linked Profile
              <select id="serverProfile"><option value="">No linked profile</option></select>
            </label>
            <label>Payload / Share Link
              <textarea id="serverPayload" rows="3" placeholder="vmess:// or vless:// or empty"></textarea>
            </label>
            <label>UUID / ID<input id="serverUuid"></label>
            <label>Alter ID<input id="serverAlterId" type="number" value="0"></label>
            <label>Security<input id="serverSecurity"></label>
            <label>Network Type<input id="serverNetworkType" placeholder="tcp/ws/grpc/httpupgrade"></label>
            <label>Path<input id="serverPath" placeholder="/ws"></label>
            <label>Host Header<input id="serverHostHeader"></label>
            <label>TLS
              <select id="serverTls"><option value="false">Off</option><option value="true">On</option></select>
            </label>
            <label>Allow Insecure
              <select id="serverAllowInsecure"><option value="false">Off</option><option value="true">On</option></select>
            </label>
            <label>Flow<input id="serverFlow"></label>
            <label>Public Key<input id="serverPublicKey"></label>
            <label>Short ID<input id="serverShortId"></label>
            <label>SpiderX<input id="serverSpiderX"></label>
            <label>Trojan Password<input id="serverTrojanPassword"></label>
            <label>SS Method<input id="serverSsMethod"></label>
            <label>OVPN Config<textarea id="serverOvpnConfig" rows="3"></textarea></label>
            <div class="row">
              <button id="saveServerBtn" class="btn primary" type="submit">Save Server</button>
              <button id="resetServerBtn" class="btn ghost" type="button">Clear</button>
            </div>
          </form>

          <article class="card">
            <div class="row">
              <h4>Server List</h4>
              <input id="serverSearch" placeholder="Search...">
            </div>
            <div id="serverList" class="list"></div>
          </article>
        </div>
      </section>

      <section id="profiles" class="screen">
        <div class="split">
          <form id="profileForm" class="card form">
            <h4 id="profileFormTitle">Add Profile</h4>
            <input id="profileDocId" type="hidden">
            <label>Document ID (optional)<input id="profileCustomId"></label>
            <label>Profile Name*<input id="profileName" required></label>
            <label>Icon<input id="profileIcon" placeholder="YT"></label>
            <label>Country / Network*<input id="profileNetwork" required></label>
            <label>Payload*<textarea id="profilePayload" rows="4" required></textarea></label>
            <label>SNI<input id="profileSni"></label>
            <label>DNS Option
              <select id="profileDns"><option value="false">Off</option><option value="true">On</option></select>
            </label>
            <label>Status*
              <select id="profileStatus"><option>active</option><option>inactive</option></select>
            </label>
            <label>Sort Order*<input id="profileSortOrder" type="number" value="0" required></label>
            <div class="row">
              <button id="saveProfileBtn" class="btn primary" type="submit">Save Profile</button>
              <button id="resetProfileBtn" class="btn ghost" type="button">Clear</button>
            </div>
          </form>
          <article class="card">
            <div class="row">
              <h4>Profile List</h4>
              <input id="profileSearch" placeholder="Search...">
            </div>
            <div id="profileList" class="list"></div>
          </article>
        </div>
      </section>

      <section id="settings" class="screen">
        <form id="settingsForm" class="card form narrow">
          <h4>App Config</h4>
          <label>Notice<textarea id="settingsNotice" rows="3"></textarea></label>
          <label>Force Update
            <select id="settingsForceUpdate"><option value="false">Off</option><option value="true">On</option></select>
          </label>
          <label>Minimum App Version<input id="settingsMinVersion"></label>
          <label>Config Version (read only)<input id="settingsConfigVersion" readonly></label>
          <div class="row">
            <button id="saveSettingsBtn" class="btn primary" type="submit">Save Settings</button>
            <button id="increaseVersionBtn" class="btn secondary" type="button">Increase Version</button>
          </div>
        </form>
      </section>
    </main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
